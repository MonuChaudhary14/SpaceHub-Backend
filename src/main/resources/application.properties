spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.address=0.0.0.0
server.port=8080

jwt.secret=${SECRET_KEY}
#ai.api.key=${AI_API_KEY}
#ai.chat.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent

spring.cache.type= none

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_EMAIL}
spring.mail.password=${SPRING_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

janus.rest-url=${JANUS_REST_URL:https://spacehub.monu14.me/janus-rest}
janus.ws-url=${JANUS_WS_URL:ws://localhost:8188/}
janus.ws-enabled=${JANUS_WS_ENABLED:false}

twofactor.api.key=${TWO_FACTOR_API}

spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
spring.data.redis.repositories.enabled=false
spring.output.ansi.enabled=ALWAYS
logging.file.name=application.log

management.health.mail.enabled=false
