spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.address=0.0.0.0
server.port=8080

jwt.secret=${SECRET_KEY}
#ai.api.key=${AI_API_KEY}
#ai.chat.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent

spring.cache.type= none

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_EMAIL}
spring.mail.password=${SPRING_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret123456789012345678901234567890}
livekit.token-ttl-seconds=${LIVEKIT_TOKEN_TTL_SECONDS:86400}

twofactor.api.key=${TWO_FACTOR_API}

spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
spring.output.ansi.enabled=ALWAYS
logging.file.name=application.log

# Clean, structured log level management
logging.level.root=INFO
logging.level.org.spacehub=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.engine.transaction=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.transaction=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Aesthetic console output format
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-35.35logger{34}){cyan} %clr(:){faint} %m%n%wEx

management.health.mail.enabled=false
