services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacehub-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${POSTGRES_INTERNAL_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_INTERNAL_PORT}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_INTERNAL_PORT:-9092}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spacehub-net

  postgres:
    image: postgres:15-alpine
    container_name: spacehub-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_INTERNAL_PORT}"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spacehub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spacehub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_INTERNAL_PORT}"
    volumes:
      - redis-data:/data
    networks:
      - spacehub-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: spacehub-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:${KAFKA_INTERNAL_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_INTERNAL_PORT:-9092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - spacehub-net

  debezium-connect:
    image: debezium/connect:2.7.0.Final
    container_name: spacehub-debezium
    restart: unless-stopped
    ports:
      - "${DEBEZIUM_PORT}:${DEBEZIUM_INTERNAL_PORT}"
    environment:
      BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-9092}
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: spacehub_connect_configs
      OFFSET_STORAGE_TOPIC: spacehub_connect_offsets
      STATUS_STORAGE_TOPIC: spacehub_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      - postgres
      - kafka
    networks:
      - spacehub-net

  livekit:
    image: livekit/livekit-server:latest
    container_name: spacehub-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "${LIVEKIT_PORT}:${LIVEKIT_INTERNAL_PORT}"
      - "${LIVEKIT_TCP_PORT}:${LIVEKIT_TCP_INTERNAL_PORT}"
      - "${LIVEKIT_UDP_PORT}:${LIVEKIT_UDP_INTERNAL_PORT}/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_USE_EXTERNAL_IP: "${LIVEKIT_RTC_USE_EXTERNAL_IP:-true}"
      LIVEKIT_RTC_NODE_IP: "${LIVEKIT_RTC_NODE_IP:-}"
    networks:
      - spacehub-net

networks:
  spacehub-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
